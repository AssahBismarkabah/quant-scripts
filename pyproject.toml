[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-scripts"
version = "0.1.0"
description = "Quant research scaffolding and strategy specs"
requires-python = ">=3.14"
dependencies = [
    "databento>=0.82.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
