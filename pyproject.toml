[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-scripts"
version = "0.1.0"
description = "Quant research scaffolding and strategy specs"
requires-python = ">=3.14"
dependencies = [
    "databento>=0.82.0",
    "pdfplumber>=0.11.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "kaggle>=1.6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
